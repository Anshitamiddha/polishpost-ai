
# Supabase PostgreSQL datasource
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Python AI service. Only this backend calls it. The secret comes from the environment
# and must match the value the AI service runs with.
ai.service.base-url=http://localhost:8000
ai.service.shared-secret=${AI_SERVICE_SHARED_SECRET:}
ai.service.timeout=150s
